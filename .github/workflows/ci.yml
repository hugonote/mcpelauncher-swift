name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Test
        run: swift test

      - name: Build app bundle
        env:
          CODESIGN_IDENTITY: skip
        run: Scripts/build-app-bundle.sh
