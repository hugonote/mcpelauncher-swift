name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      APP_NAME: Minecraft Bedrock Launcher
      CODESIGN_IDENTITY: "-"
      SPARKLE_FEED_URL: https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml

    steps:
      - uses: actions/checkout@v6

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: Scripts/release.sh

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: hugonote/homebrew-mcpelauncher-swift
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: Scripts/update-homebrew-cask.sh
